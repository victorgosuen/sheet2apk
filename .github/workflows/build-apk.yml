name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'Planilha App'
      app_url:
        description: 'URL do Google Web App'
        required: true
      package_name:
        description: 'Package Name (applicationId)'
        required: false
        default: 'com.sheet.app'
      theme_color:
        description: 'Cor Primária (Hex)'
        required: false
        default: '#0F9D58'
      icon_base64:
        description: 'Ícone Base64 (PNG)'
        required: false
        default: ''
      build_mode:
        description: 'Modo: url ou directory'
        required: false
        default: 'url'
      source_tag:
        description: 'Tag de release do source.zip (se modo directory)'
        required: false
        default: ''
      orientation:
        description: 'Orientação de Tela: auto, portrait, landscape'
        required: false
        default: 'auto'
      perm_location:
        description: 'Permissão de Localização GPS'
        required: false
        default: 'false'
      perm_camera:
        description: 'Permissão de Câmera'
        required: false
        default: 'false'
      perm_mic:
        description: 'Permissão de Microfone'
        required: false
        default: 'false'
      keep_screen_on:
        description: 'Manter Tela Ligada'
        required: false
        default: 'false'
      fullscreen:
        description: 'Modo Tela Cheia'
        required: false
        default: 'false'
      pull_to_refresh:
        description: 'Puxar para Atualizar'
        required: false
        default: 'true'
      splash_base64:
        description: 'Splash Screen Base64'
        required: false
        default: ''
      splash_type:
        description: 'Tipo de Splash: none, lottie, image'
        required: false
        default: 'none'
      build_id:
        description: 'ID Único da Compilação'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node para compilar projetos web
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Python e Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow

      - name: Baixar Arquivos da Pasta (Modo Diretório)
        if: ${{ inputs.build_mode == 'directory' && inputs.source_tag != '' }}
        run: |
          gh release download "${{ inputs.source_tag }}" --pattern "source.zip" --dir .
          echo "ZIP_PATH=source.zip" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Injetar Parâmetros no Projeto Android
        id: prep
        run: |
          python scripts/prepare-build.py \
            --app-name "${{ inputs.app_name }}" \
            --app-url "${{ inputs.app_url }}" \
            --build-mode "${{ inputs.build_mode }}" \
            --zip-file "${{ env.ZIP_PATH }}" \
            --package-name "${{ inputs.package_name }}" \
            --theme-color "${{ inputs.theme_color }}" \
            --icon-base64 "${{ inputs.icon_base64 }}" \
            --orientation "${{ inputs.orientation }}" \
            --perm-location "${{ inputs.perm_location }}" \
            --perm-camera "${{ inputs.perm_camera }}" \
            --perm-mic "${{ inputs.perm_mic }}" \
            --keep-screen-on "${{ inputs.keep_screen_on }}" \
            --fullscreen "${{ inputs.fullscreen }}" \
            --pull-to-refresh "${{ inputs.pull_to_refresh }}" \
            --splash-base64 "${{ inputs.splash_base64 }}" \
            --splash-type "${{ inputs.splash_type }}"

      - name: Configurar Gradle 8.4 Oficial
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Garantir Keystore Padrão
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK com Gradle
        run: |
          cd android-template
          gradle assembleRelease --stacktrace

      - name: Renomear e Preparar Arquivo APK
        run: |
          SAFE_NAME="${{ steps.prep.outputs.safe_app_name }}"
          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="app-release"
          fi
          
          # Procura o APK gerado
          APK_PATH=$(find android-template/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erro: Arquivo APK não encontrado após compilação!"
            exit 1
          fi
          
          mkdir -p dist
          cp "$APK_PATH" "dist/${SAFE_NAME}.apk"
          echo "APK_FILE_PATH=dist/${SAFE_NAME}.apk" >> $GITHUB_ENV
          echo "FINAL_APK_NAME=${SAFE_NAME}.apk" >> $GITHUB_ENV

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.build_id }}"
          name: "${{ inputs.app_name }} (Build ${{ inputs.build_id }})"
          body: |
            ### Aplicativo Gerado com Sucesso! 🚀
            - **Nome do App:** ${{ inputs.app_name }}
            - **URL Conectada:** ${{ inputs.app_url }}
            - **ID do Build:** `${{ inputs.build_id }}`
            - **Arquivo:** `${{ env.FINAL_APK_NAME }}`
          draft: false
          prerelease: false
          files: ${{ env.APK_FILE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Limpar Release Temporária de Código Fonte
        if: ${{ inputs.build_mode == 'directory' && inputs.source_tag != '' }}
        run: |
          gh release delete "${{ inputs.source_tag }}" --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
